<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ritual Step 1</title>
<meta name="theme-color" content="#0d3b2e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ritual Step 1">
<style>
  :root{
    --pine-900:#0a2e23;
    --pine-800:#0d3b2e;
    --pine-600:#155c47;
    --pine-100:#e2efe9;
    --cream:#f7f4ec;
    --coral:#d8663f;
    --coral-light:#f3e0d6;
    --ink:#1c2622;
    --muted:#6b7a74;
    --line:#dde3df;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--cream);
    color:var(--ink);
    padding-bottom:3rem;
  }
  header{
    background:var(--pine-800);
    color:var(--cream);
    padding:2rem 1.5rem 1.5rem;
    border-bottom-left-radius:22px;
    border-bottom-right-radius:22px;
  }
  header .eyebrow{
    font-size:.72rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--pine-100);
    opacity:.8;
    margin:0 0 .35rem;
  }
  header h1{
    margin:0;
    font-size:1.6rem;
    font-weight:700;
    letter-spacing:-.01em;
  }
  .streak-row{
    display:flex;
    align-items:center;
    gap:.9rem;
    margin-top:1.1rem;
  }
  .streak-num{
    font-size:2.6rem;
    font-weight:800;
    line-height:1;
  }
  .streak-label{
    font-size:.78rem;
    color:var(--pine-100);
    opacity:.85;
    max-width:12rem;
    line-height:1.3;
  }
  main{
    max-width:640px;
    margin:0 auto;
    padding:1.25rem 1.1rem;
  }
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:1.1rem 1.15rem;
    margin-bottom:1.1rem;
  }
  .card h2{
    font-size:.95rem;
    margin:0 0 .9rem;
    color:var(--pine-800);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .card h2 .tag{
    font-size:.68rem;
    font-weight:600;
    color:var(--coral);
    background:var(--coral-light);
    padding:.2rem .55rem;
    border-radius:999px;
    text-transform:none;
  }
  .step{
    display:flex;
    align-items:flex-start;
    gap:.7rem;
    padding:.6rem 0;
    border-bottom:1px solid var(--line);
  }
  .step:last-child{border-bottom:none;}
  .step input[type=checkbox]{
    appearance:none;
    -webkit-appearance:none;
    width:22px;height:22px;
    min-width:22px;
    border-radius:7px;
    border:2px solid var(--pine-600);
    margin-top:1px;
    cursor:pointer;
    position:relative;
    transition:background .15s, border-color .15s;
  }
  .step input[type=checkbox]:checked{
    background:var(--pine-600);
    border-color:var(--pine-600);
  }
  .step input[type=checkbox]:checked::after{
    content:'';
    position:absolute;
    left:6px;top:2px;
    width:6px;height:11px;
    border:solid white;
    border-width:0 2px 2px 0;
    transform:rotate(40deg);
  }
  .step label{
    flex:1;
    cursor:pointer;
    line-height:1.3;
  }
  .step .time{
    display:block;
    font-size:.72rem;
    color:var(--muted);
    font-weight:600;
    letter-spacing:.02em;
  }
  .step .desc{
    font-size:.92rem;
  }
  .step.done label .desc{
    color:var(--muted);
    text-decoration:line-through;
    text-decoration-color:var(--line);
  }
  .goal-row{
    display:flex;
    align-items:center;
    gap:.6rem;
    margin-top:.3rem;
  }
  .goal-row input[type=number]{
    width:70px;
    padding:.4rem .5rem;
    border-radius:8px;
    border:1px solid var(--line);
    font-size:.95rem;
    text-align:center;
  }
  .progress-track{
    height:8px;
    background:var(--pine-100);
    border-radius:999px;
    overflow:hidden;
    margin-top:.3rem;
  }
  .progress-fill{
    height:100%;
    background:var(--coral);
    border-radius:999px;
    transition:width .25s ease;
  }
  .progress-caption{
    font-size:.75rem;
    color:var(--muted);
    margin-top:.4rem;
  }
  textarea{
    width:100%;
    min-height:80px;
    border:1px solid var(--line);
    border-radius:10px;
    padding:.6rem .7rem;
    font-family:inherit;
    font-size:.88rem;
    resize:vertical;
  }
  textarea:focus, input:focus{
    outline:2px solid var(--pine-600);
    outline-offset:1px;
  }
  .close-grid{
    display:grid;
    gap:.7rem;
  }
  .close-grid label{
    font-size:.75rem;
    font-weight:600;
    color:var(--pine-800);
    display:block;
    margin-bottom:.3rem;
  }
  .grid90{
    display:grid;
    grid-template-columns:repeat(15, 1fr);
    gap:4px;
    margin-top:.4rem;
  }
  .cell{
    aspect-ratio:1;
    border-radius:4px;
    background:var(--line);
  }
  .cell.today{ box-shadow:0 0 0 2px var(--coral) inset; }
  .cell.full{ background:var(--pine-600); }
  .cell.partial{ background:#8fbfae; }
  .cell.future{ background:transparent; border:1px dashed var(--line); }
  .legend{
    display:flex;
    gap:1rem;
    margin-top:.7rem;
    font-size:.7rem;
    color:var(--muted);
    flex-wrap:wrap;
  }
  .legend span{display:flex;align-items:center;gap:.35rem;}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .btn{
    background:var(--pine-800);
    color:#fff;
    border:none;
    padding:.65rem 1rem;
    border-radius:10px;
    font-size:.85rem;
    font-weight:600;
    cursor:pointer;
    width:100%;
  }
  .btn:active{ background:var(--pine-900); }
  .save-note{
    font-size:.72rem;
    color:var(--muted);
    text-align:center;
    margin-top:.5rem;
  }
  .pearl{
    background:var(--coral-light);
    border-left:3px solid var(--coral);
    border-radius:8px;
    padding:.6rem .8rem;
    font-size:.82rem;
    color:var(--ink);
    margin-bottom:1.1rem;
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Lunes a viernes · 5:00 am – biblioteca</p>
  <h1>Ritual Step 1</h1>
  <div class="streak-row">
    <div class="streak-num" id="streakNum">0</div>
    <div class="streak-label">días seguidos completando la estructura completa</div>
  </div>
</header>

<main>

  <div class="pearl" id="dateLabel"></div>

  <div class="card">
    <h2>Hoy <span class="tag" id="todayTag">0/7</span></h2>
    <div id="stepsContainer"></div>

    <div class="progress-track"><div class="progress-fill" id="todayFill" style="width:0%"></div></div>
    <p class="progress-caption" id="todayCaption">0 de 7 pasos completados</p>
  </div>

  <div class="card">
    <h2>Cierre del día <span class="tag">5 min</span></h2>
    <div class="close-grid">
      <div>
        <label>Error log — qué falló y por qué</label>
        <textarea id="errorLog" placeholder="Ej: Endocrino — confundí SIADH con diabetes insípida por no fijarme en Na sérico."></textarea>
      </div>
      <div>
        <label>Una sola cosa para mañana</label>
        <textarea id="nextStep" placeholder="Ej: Repasar tabla de electrolitos antes del primer bloque."></textarea>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Progreso — 90 días <span class="tag" id="daysDone">0/90</span></h2>
    <div class="grid90" id="grid90"></div>
    <div class="legend">
      <span><span class="dot" style="background:var(--pine-600)"></span> completo</span>
      <span><span class="dot" style="background:#8fbfae"></span> parcial</span>
      <span><span class="dot" style="background:var(--line)"></span> incompleto</span>
      <span><span class="dot" style="border:1px dashed var(--line)"></span> por venir</span>
    </div>
  </div>

  <button class="btn" id="saveBtn">Guardar día</button>
  <p class="save-note">Se guarda automáticamente en este dispositivo/navegador.</p>

</main>

<script>
const STEPS = [
  {id:'ex', time:'5:00 – 5:30 am', desc:'Ejercicio'},
  {id:'routine', time:'5:30 – 7:00 am', desc:'Rutina fija: ducha, desayuno, salida hacia la biblioteca'},
  {id:'arrival', time:'7:00 am', desc:'Llegada a la biblioteca'},
  {id:'goal', time:'Antes de empezar', desc:'Meta del día definida (número fijo de preguntas)'},
  {id:'study', time:'Bloque principal', desc:'Bloque de estudio completado (mixto, sistemas débiles)'},
  {id:'errorlog', time:'Al cerrar', desc:'Error log de hoy escrito'},
  {id:'close', time:'Últimos 5 min', desc:'Cierre del día: qué se cumplió + próximo paso'}
];

const todayKey = () => new Date().toISOString().slice(0,10);
const store = () => JSON.parse(localStorage.getItem('ritualStep1') || '{}');
const save = (data) => localStorage.setItem('ritualStep1', JSON.stringify(data));

function init(){
  const data = store();
  const key = todayKey();
  if(!data[key]) data[key] = {steps:{}, goal:'', errorLog:'', nextStep:''};
  save(data);
  renderDateLabel();
  renderSteps(data, key);
  renderStreak(data);
  renderGrid(data);
  document.getElementById('errorLog').value = data[key].errorLog || '';
  document.getElementById('nextStep').value = data[key].nextStep || '';

  document.getElementById('saveBtn').addEventListener('click', () => {
    const d = store();
    const k = todayKey();
    d[k].errorLog = document.getElementById('errorLog').value;
    d[k].nextStep = document.getElementById('nextStep').value;
    save(d);
    const btn = document.getElementById('saveBtn');
    const original = btn.textContent;
    btn.textContent = 'Guardado ✓';
    setTimeout(()=>btn.textContent = original, 1200);
  });
}

function renderDateLabel(){
  const d = new Date();
  const opts = {weekday:'long', day:'numeric', month:'long'};
  const label = d.toLocaleDateString('es-ES', opts);
  document.getElementById('dateLabel').textContent =
    'Hoy es ' + label.charAt(0).toUpperCase() + label.slice(1) + '. Marca cada paso apenas lo completes, en orden.';
}

function renderSteps(data, key){
  const container = document.getElementById('stepsContainer');
  container.innerHTML = '';
  STEPS.forEach(s => {
    const wrap = document.createElement('div');
    wrap.className = 'step' + (data[key].steps[s.id] ? ' done' : '');

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!data[key].steps[s.id];
    cb.id = 'cb_' + s.id;
    cb.addEventListener('change', () => {
      const d = store();
      d[key].steps[s.id] = cb.checked;
      save(d);
      wrap.classList.toggle('done', cb.checked);
      renderStreak(d);
      renderGrid(d);
      updateTodayProgress(d, key);
    });

    const label = document.createElement('label');
    label.setAttribute('for', 'cb_' + s.id);
    label.innerHTML = '<span class="time">' + s.time + '</span><span class="desc">' + s.desc + '</span>';

    wrap.appendChild(cb);
    wrap.appendChild(label);

    if(s.id === 'goal'){
      const goalRow = document.createElement('div');
      goalRow.className = 'goal-row';
      const input = document.createElement('input');
      input.type = 'number';
      input.min = 0;
      input.placeholder = '#';
      input.value = data[key].goal || '';
      input.addEventListener('input', () => {
        const d = store();
        d[key].goal = input.value;
        save(d);
      });
      const span = document.createElement('span');
      span.style.fontSize = '.8rem';
      span.style.color = 'var(--muted)';
      span.textContent = 'preguntas hoy';
      goalRow.appendChild(input);
      goalRow.appendChild(span);
      wrap.appendChild(goalRow);
    }

    container.appendChild(wrap);
  });
  updateTodayProgress(data, key);
}

function updateTodayProgress(data, key){
  const total = STEPS.length;
  const done = STEPS.filter(s => data[key].steps[s.id]).length;
  const pct = Math.round((done/total)*100);
  document.getElementById('todayFill').style.width = pct + '%';
  document.getElementById('todayCaption').textContent = done + ' de ' + total + ' pasos completados';
  document.getElementById('todayTag').textContent = done + '/' + total;
}

function dayCompletion(day){
  if(!day) return 0;
  const done = STEPS.filter(s => day.steps[s.id]).length;
  return done / STEPS.length;
}

function renderStreak(data){
  let streak = 0;
  let d = new Date();
  while(true){
    const k = d.toISOString().slice(0,10);
    const day = data[k];
    if(day && dayCompletion(day) === 1){
      streak++;
      d.setDate(d.getDate()-1);
    } else if(k === todayKey()){
      // today not finished yet doesn't break streak counting from yesterday
      d.setDate(d.getDate()-1);
      continue;
    } else {
      break;
    }
  }
  document.getElementById('streakNum').textContent = streak;
}

function renderGrid(data){
  const grid = document.getElementById('grid90');
  grid.innerHTML = '';
  const today = new Date();
  const start = new Date();
  start.setDate(today.getDate() - 44);
  let doneCount = 0;

  for(let i=0; i<90; i++){
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const k = d.toISOString().slice(0,10);
    const cell = document.createElement('div');
    const isFuture = d > today;
    const isToday = k === todayKey();

    if(isFuture){
      cell.className = 'cell future';
    } else {
      const comp = dayCompletion(data[k]);
      if(comp === 1){ cell.className = 'cell full'; doneCount++; }
      else if(comp > 0){ cell.className = 'cell partial'; }
      else { cell.className = 'cell'; }
    }
    if(isToday) cell.classList.add('today');
    cell.title = k;
    grid.appendChild(cell);
  }
  document.getElementById('daysDone').textContent = doneCount + '/90';
}

init();
</script>

</body>
</html>
